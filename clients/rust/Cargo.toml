[package]
name = "zoldyq-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for ZoldyQ message queue"
license = "MIT"
repository = "https://github.com/zoldyq/zoldyq"
keywords = ["message-queue", "async", "queue", "zoldyq"]
categories = ["network-programming", "asynchronous"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
tokio = { version = "1", features = ["net", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
